{% extends "base.html" %}
{% block titulo %}Cambiar contraseña{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4">
      <h1 class="h4 mb-3"><i class="bi bi-key"></i> Cambiar contraseña</h1>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Contraseña actual</label>
          <input class="form-control" type="password" name="actual" required autocomplete="current-password">
        </div>
        <div class="mb-3">
          <label class="form-label">Nueva contraseña</label>
          <input class="form-control" type="password" name="nueva" required minlength="8" autocomplete="new-password">
          <div class="form-text">Mínimo 8 caracteres.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirmar nueva contraseña</label>
          <input class="form-control" type="password" name="confirmar" required minlength="8" autocomplete="new-password">
        </div>
        <button class="btn btn-primary">Guardar</button>
        <a class="btn btn-link" href="{{ url_for('inicio.index') }}">Cancelar</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
