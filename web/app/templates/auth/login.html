{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenedor %}container{% endblock %}
{% block contenido %}
<div class="login-wrap">
  <div class="card login-card p-4">
    <div class="text-center mb-3">
      <i class="bi bi-shop fs-1 text-primary"></i>
      <h1 class="h4 mt-2">{{ store_name }}</h1>
      <p class="text-muted mb-0">Inicia sesión para continuar</p>
    </div>
    <form method="post" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="username">Usuario</label>
        <input class="form-control" id="username" name="username" required autofocus autocomplete="username"
               value="{{ request.form.username or '' }}">
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary w-100">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
